<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Vex 品牌标识：渐变圆角方块 + 厚实圆头 V（与标题栏 Logo / 应用图标同构） -->
  <defs>
    <linearGradient id="vex-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1677FF"/>
      <stop offset="1" stop-color="#69B1FF"/>
    </linearGradient>
    <clipPath id="vex-rounded">
      <rect width="256" height="256" rx="56" ry="56"/>
    </clipPath>
  </defs>
  <g clip-path="url(#vex-rounded)">
    <rect width="256" height="256" fill="url(#vex-grad)"/>
  </g>
  <path d="M64 62 L128 198 L192 62" fill="none" stroke="#FFFFFF" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
