name: windows-installer-contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-installer-contract.yml'
      - 'scripts/*.iss'
      - 'scripts/installer/**'
      - 'scripts/Languages/**'
      - 'scripts/tests/windows_setup_contract_test.ps1'
      - 'LICENSE'
  pull_request:
    paths:
      - '.github/workflows/windows-installer-contract.yml'
      - 'scripts/*.iss'
      - 'scripts/installer/**'
      - 'scripts/Languages/**'
      - 'scripts/tests/windows_setup_contract_test.ps1'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-compile:
    name: 独立安装器契约真编译
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验快照并独立编译受控载荷
        shell: pwsh
        env:
          CODEWF_TEST_TMP: ${{ runner.temp }}/codewf-installer-contract
        run: ./scripts/tests/windows_setup_contract_test.ps1 -Compile
      - name: 上传编译证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-contract
          path: ${{ runner.temp }}/codewf-installer-contract/**/verification.json
          if-no-files-found: ignore
      - name: 验证跨安装范围迁移
        shell: pwsh
        run: |
          $compiler=Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          python scripts/installer/tests/verify_vex_migration.py --compiler $compiler --output '${{ runner.temp }}/vex-migration'
          if ($LASTEXITCODE) { throw 'Vex migration verification failed' }
      - name: 上传迁移证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-migration
          path: |
            ${{ runner.temp }}/vex-migration/receipt.json
            ${{ runner.temp }}/vex-migration/assertions.txt
          if-no-files-found: ignore

  native-visual:
    name: 安装器原生中英文与浅深色回归
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 编译并运行独立桌面安全夹具
        shell: pwsh
        run: |
          $compiler=Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          ./scripts/installer/tests/verify_vex_visual.ps1 -Compiler $compiler -Output '${{ runner.temp }}/vex-native-visual'
      - name: 上传原生窗口与交互证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-native-visual
          path: |
            ${{ runner.temp }}/vex-native-visual/**/*.png
            ${{ runner.temp }}/vex-native-visual/**/*.json
            ${{ runner.temp }}/vex-native-visual/**/setup.log
          if-no-files-found: ignore
