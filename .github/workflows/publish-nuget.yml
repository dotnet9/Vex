name: publish-nuget

# 推送 v* 格式 tag 时触发，例如 v1.1.2.7。
# 包版本号以 Directory.Build.props 的 <Version> 为准（打 tag 前先升版本），
# tag 必须与包版本一致；GitHub Release 由安装包工作流统一创建。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # NuGet Trusted Publishing：用 OIDC 令牌换取一次性发布凭据

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          # 包目标 net8.0 / net10.0
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Check tag matches package version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $tagVersion = $env:TAG.TrimStart('v')
          $props = Get-Content -LiteralPath Directory.Build.props -Raw -Encoding UTF8
          if ($props -match '<Version>([^<]+)</Version>') {
            $packageVersion = $Matches[1].Trim()
            if ($tagVersion -ne $packageVersion) {
              throw "Tag ($tagVersion) 与 Directory.Build.props 的 Version ($packageVersion) 不一致。"
            }
          } else {
            throw '未在 Directory.Build.props 中找到 <Version>。'
          }

      - name: Build
        shell: pwsh
        run: |
          dotnet build Vex.slnx -c Release
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: Pack
        shell: pwsh
        run: |
          # 控件及主题资源统一发布为 Vex.Controls（Vex 主程序 IsPackable=false）；
          # 新版 SDK 的 pack 不再隐式构建，须先 Build 再 --no-build Pack
          $projects = @(
            'src/Vex.Controls/Vex.Controls.csproj'
          )

          foreach ($project in $projects) {
            dotnet pack $project -c Release --no-build -o artifacts/packages
            if ($LASTEXITCODE -ne 0) { throw "pack failed: $project" }
          }

          Get-ChildItem artifacts/packages | ForEach-Object { Write-Host $_.Name }

      - name: NuGet login (Trusted Publishing)
        uses: nuget/login@v1
        id: login
        with:
          user: dotnet9

      - name: Push to nuget.org
        shell: pwsh
        run: |
          # 主包：失败即中止
          Get-ChildItem artifacts/packages -Filter *.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName `
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate --no-symbols --timeout 600
            if ($LASTEXITCODE -ne 0) { throw "push failed: $($_.Name)" }
          }

      - name: Push symbol packages
        continue-on-error: true
        shell: pwsh
        run: |
          # 符号包失败独立记录，保留主包已经发布成功的结果。
          $failedSymbols = @()
          Get-ChildItem artifacts/packages -Filter *.snupkg | ForEach-Object {
            dotnet nuget push $_.FullName `
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate --timeout 600
            if ($LASTEXITCODE -ne 0) { $failedSymbols += $_.Name }
          }
          if ($failedSymbols.Count -gt 0) {
            throw "Optional symbol upload failed: $($failedSymbols -join ', '). Main packages were published successfully."
          }
