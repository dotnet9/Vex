name: 安装包结构验证
on:
  push:
    branches: [main]
  pull_request:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 验证 Linux 安装入口及失败传播
        shell: pwsh
        run: ./scripts/tests/linux_packaging_test.ps1
      - name: 验证五平台资产门禁
        shell: pwsh
        run: ./scripts/tests/release_installers_test.ps1
      - name: 验证 macOS 资源布局及失败传播
        shell: bash
        run: bash scripts/tests/macos_packaging_test.sh
