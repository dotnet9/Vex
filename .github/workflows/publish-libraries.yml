name: publish-libraries

# 推送 lib-v* 格式 tag 时发布迁入主仓的四个库包（Markdown/Lite/Core/MindView）：
# 包版本号以各库 csproj 的 <Version> 为准（发版前先统一升版），tag 只负责触发，
# 不一致时阻断。NuGet 侧用可信发布（nuget.org 需为 Vex 仓库+本 workflow 配置
# 四个包 ID 的 Trusted Publishing；未配置时 push 步骤会 403）。
on:
  push:
    tags:
      - 'lib-v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # NuGet 可信发布：用 OIDC 令牌换取一次性发布凭据

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Check tag matches package versions
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if (-not $env:TAG.StartsWith('lib-v')) { Write-Host "手动触发，跳过 tag 校验。"; exit 0 }
          $tagVersion = $env:TAG.TrimStart('l','i','b','-','v')
          $mismatch = @()
          foreach ($project in @('src/CodeWF.Avalonia.Markdown/CodeWF.Avalonia.Markdown.csproj',
                                 'src/CodeWF.Avalonia.Markdown.Lite/CodeWF.Avalonia.Markdown.Lite.csproj',
                                 'src/CodeWF.Avalonia.Markdown.Core/CodeWF.Avalonia.Markdown.Core.csproj',
                                 'src/CodeWF.Avalonia.MindView/CodeWF.Avalonia.MindView.csproj')) {
            $props = Get-Content -LiteralPath $project -Raw -Encoding UTF8
            if ($props -match '<Version>([^<]+)</Version>') {
              if ($Matches[1].Trim() -ne $tagVersion) { $mismatch += "$project=$($Matches[1])" }
            }
          }
          if ($mismatch.Count -gt 0) { throw "tag $env:TAG 与库版本不一致：$($mismatch -join '; ')" }
          Write-Host "tag 校验通过：$env:TAG"

      - name: Pack
        shell: pwsh
        run: |
          $projects = @(
            'src/CodeWF.Avalonia.Markdown/CodeWF.Avalonia.Markdown.csproj',
            'src/CodeWF.Avalonia.Markdown.Lite/CodeWF.Avalonia.Markdown.Lite.csproj',
            'src/CodeWF.Avalonia.Markdown.Core/CodeWF.Avalonia.Markdown.Core.csproj',
            'src/CodeWF.Avalonia.MindView/CodeWF.Avalonia.MindView.csproj'
          )
          foreach ($project in $projects) {
            dotnet pack $project -c Release -o artifacts/lib-packages
            if ($LASTEXITCODE -ne 0) { throw "pack failed: $project" }
          }
          Get-ChildItem artifacts/lib-packages | ForEach-Object { Write-Host $_.Name }

      - name: NuGet login (Trusted Publishing)
        uses: nuget/login@v1
        id: login
        with:
          user: dotnet9

      - name: Push to nuget.org
        shell: pwsh
        run: |
          Get-ChildItem artifacts/lib-packages -Filter *.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName `
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate --no-symbols --timeout 600
            if ($LASTEXITCODE -ne 0) { throw "package push failed: $($_.Name)" }
          }
