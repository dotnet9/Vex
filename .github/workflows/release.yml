name: release

# 推送 v* 标签发布 Vex 全平台安装包（5 个 RID，仓库自带 PublishProfile）：
# win-x64 用 Inno Setup 生成 setup.exe（NativeAOT 裁剪），
# linux-x64 / linux-arm64 生成 deb，macOS 生成 dmg。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不含 v），例如 1.1.2.7'
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-installer-contract:
    name: Windows 安装器编译预检
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 独立编译安装器受控载荷
        shell: pwsh
        run: ./scripts/tests/windows_setup_contract_test.ps1 -Compile
      - name: 验证跨安装范围迁移
        shell: pwsh
        run: |
          $compiler=Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          python scripts/installer/tests/verify_vex_migration.py --compiler $compiler --output '${{ runner.temp }}/vex-migration'
          if ($LASTEXITCODE) { throw 'Vex migration verification failed' }

  publish:
    name: 发布 ${{ matrix.rid }}
    needs: windows-installer-contract
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: osx-x64
            os: macos-15-intel
          - rid: osx-arm64
            os: macos-14
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 计算版本号
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'.TrimStart('v', 'V')
          } else {
            $version = '${{ github.ref_name }}'.TrimStart('v', 'V')
          }
          [xml] $props = Get-Content -LiteralPath Directory.Build.props -Raw
          if ($version -ne $props.Project.PropertyGroup.Version) {
            throw "Release version $version must match Directory.Build.props."
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "版本：$version"

      - name: 安装 NativeAOT 依赖 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # 本地与 CI 共用 NativeAOT 配方，各平台在对应架构的 runner 上构建。
      - name: 发布（PublishProfile + NativeAOT）
        shell: pwsh
        run: |
          ./scripts/publish.ps1 -RuntimeIdentifier '${{ matrix.rid }}' -Version $env:APP_VERSION

      - name: 验证正式 Windows 原生产物
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP ('vex-runtime-' + [guid]::NewGuid().ToString('N'))
          $start = [Diagnostics.ProcessStartInfo]::new((Resolve-Path './artifacts/publish/win-x64/Vex/Vex.exe').Path)
          $start.UseShellExecute = $false
          $start.CreateNoWindow = $true
          $start.ArgumentList.Add('--verify-runtime')
          $start.ArgumentList.Add($directory)
          $process = [Diagnostics.Process]::Start($start)
          if (-not $process.WaitForExit(30000)) { throw 'Native runtime verification timed out.' }
          if ($process.ExitCode -ne 0) { throw "Native runtime verification failed: $($process.ExitCode)" }
          $result = Get-Content -LiteralPath (Join-Path $directory 'runtime-verification.txt') -Raw
          if ($result -notmatch '^NativeAOT runtime verification passed;') { throw 'Native runtime evidence is missing.' }
          Write-Output $result

      - name: 打包 Linux deb + sha256
        if: startsWith(matrix.rid, 'linux-')
        shell: pwsh
        run: pwsh scripts/package_linux_deb.ps1 -RuntimeIdentifier '${{ matrix.rid }}' -Version $env:APP_VERSION -Force

      - name: 打包 Linux 绿色版 tar.gz + sha256
        if: startsWith(matrix.rid, 'linux-')
        shell: bash
        run: |
          rid='${{ matrix.rid }}'
          mkdir -p artifacts/release
          tar -czf "artifacts/release/Vex-v$APP_VERSION-$rid.tar.gz" -C "artifacts/publish/$rid/Vex" .
          sha256sum "artifacts/release/Vex-v$APP_VERSION-$rid.tar.gz" > "artifacts/release/Vex-v$APP_VERSION-$rid.tar.gz.sha256"

      - name: 打包 macOS dmg
        if: startsWith(matrix.rid, 'osx-')
        shell: bash
        run: |
          chmod +x scripts/package_macos.sh
          ./scripts/package_macos.sh ${{ matrix.rid }}

      - name: 构建 Windows 安装包
        if: startsWith(matrix.rid, 'win-')
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: scripts/Vex.iss
          options: >-
            /DAppVersion=${{ env.APP_VERSION }}
            /DSourceDir=${{ github.workspace }}\artifacts\publish\${{ matrix.rid }}\Vex
            /DOutputDir=${{ github.workspace }}\artifacts\release

      - name: 计算安装包 SHA-256
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          $installerName = "Vex-v$env:APP_VERSION-win-x64-setup.exe"
          $installerPath = Join-Path "artifacts/release" $installerName
          if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) {
            throw "Installer was not produced: $installerPath"
          }
          $sha = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $installerName" | Set-Content -LiteralPath "$installerPath.sha256" -Encoding ASCII

      - name: 打包 Windows 绿色版 zip + sha256
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          $zipName = "Vex-v$env:APP_VERSION-win-x64.zip"
          $zipPath = Join-Path "artifacts/release" $zipName
          Compress-Archive -Path 'artifacts/publish/win-x64/Vex/*' -DestinationPath $zipPath -Force
          $sha = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $zipName" | Set-Content -LiteralPath "$zipPath.sha256" -Encoding ASCII

      - name: 收集 macOS dmg 到发布目录
        if: startsWith(matrix.rid, 'osx-')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/release -Force | Out-Null
          Copy-Item -Path "artifacts/macos/*.dmg" -Destination artifacts/release/ -Force
          Copy-Item -Path "artifacts/macos/*.zip" -Destination artifacts/release/ -Force
          Copy-Item -Path "artifacts/macos/*.sha256" -Destination artifacts/release/ -Force
          Get-ChildItem artifacts/release | ForEach-Object { Write-Host $_.Name }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Vex-${{ matrix.rid }}
          path: artifacts/release/*
          if-no-files-found: error

  release:
    name: 创建 GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: Vex-*
          path: artifacts/release
          merge-multiple: true

      - name: 计算版本号
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'.TrimStart('v', 'V')
            $tagName = "v$version"
          } else {
            # 沿用被推送的原始标签，避免额外创建新标签。
            $tagName = '${{ github.ref_name }}'
            $version = $tagName.TrimStart('v', 'V')
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag_name=$tagName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 校验五平台安装包与绿色版压缩包
        shell: pwsh
        run: ./scripts/verify_release_installers.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: 准备发布说明
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./scripts/prepare_release_notes.ps1 -Version $env:VERSION -OutputPath artifacts/release-body.md -FetchTag

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Vex v${{ steps.version.outputs.version }}
          body_path: artifacts/release-body.md
          generate_release_notes: true
          files: |
            artifacts/release/*.exe
            artifacts/release/*.deb
            artifacts/release/*.dmg
            artifacts/release/*.zip
            artifacts/release/*.tar.gz
            artifacts/release/*.sha256
