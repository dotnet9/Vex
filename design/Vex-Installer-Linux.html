 return '<div class="native-shell"><main class="linux-content" data-step="'+state.step+'"><div class="linux-product">'+productIcon()+'<div><h2 class="hero-name">Vex</h2><p class="hero-tagline">'+text('slogan')+'</p><p class="package-meta">'+product().version+' · amd64 · DEB</p></div></div><div class="linux-actions">'+actions+'</div><details class="package-details"><summary>'+text('packageDetails')+'</summary><dl><dt>'+text('packageVersion')+'</dt><dd>'+product().version+'</dd><dt>'+text('packageArchitecture')+'</dt><dd>amd64</dd><dt>'+text('packageSize')+'</dt><dd>'+text('spaceValue')+'</dd><dt>'+text('packageSource')+'</dt><dd>'+text('localFile')+'</dd><dt>'+text('dependencies')+'</dt><dd>libc6 · libx11-6 · libfontconfig1 · libfreetype6</dd></dl></details></main><footer class="native-footer"><span>CodeWF · '+product().version+'</span><span>'+icon('lock',12)+' '+text('authHint')+'</span></footer></div>';
}

function renderModal(){if(!state.modal)return '';if(state.modal==='cancel')return `<div class="modal-backdrop"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><h3 id="dialogTitle">${icon('alert',23)}${text('cancelTitle')}</h3><p>${text('cancelBody')}</p><div class="actions">${button('keepInstalling','modal-dismiss')}${button('stopInstalling','stop',{primary:true})}</div></section></div>`;return `<div class="modal-backdrop"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><h3 id="dialogTitle">${icon('lock',24)}${text('authLinuxTitle')}</h3><p>${escape(text(state.operation==='uninstall'?'authRemoveBody':'authLinuxBody'))}</p><div class="dialog-meta"><strong>Vex</strong><br>${text('authDemo')}</div><label for="previewPassword">${text('password')}</label><input id="previewPassword" class="input-field" type="password" readonly value="preview" aria-readonly="true"><div class="actions">${button('cancel','modal-dismiss')}${button('authenticate','authorize',{primary:true,id:'authorizeButton'})}</div></section></div>`;}
function render(){
 const active=document.activeElement?.id,frame=$('installerWindow'),oldDialog=frame.querySelector('.dialog');
 if(!oldDialog&&state.modal)modalReturnFocus=document.activeElement;
 document.documentElement.lang=state.language==='zh'?'zh-CN':'en';
 document.documentElement.dataset.theme=state.theme==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):state.theme;
 document.documentElement.dataset.reduced=String(state.reduced);
 document.title='Vex · Linux '+(state.language==='zh'?'安装':'Installer');
 frame.dataset.step=state.step;
 for(const phase of ['installing','repairing','uninstalling','complete'])frame.classList.toggle(phase,state.step===phase);
 frame.classList.toggle('hidden-window',state.closed);frame.classList.toggle('minimized',state.minimized);
 frame.setAttribute('aria-label','Vex Linux '+(state.language==='zh'?'安装':'Installer'));
 frame.innerHTML=titlebar()+renderLinux()+renderModal();
 document.querySelectorAll('[data-brand-link]').forEach(link=>link.setAttribute('aria-label',text('brandLink')));
 if(!$('toast'))frame.insertAdjacentHTML('beforeend','<div class="toast" id="toast" role="status" aria-live="polite"></div>');lastStep=state.step;updateProgress();
 const dialog=[...frame.querySelectorAll('.dialog')].at(-1),shell=frame.querySelector('.native-shell');
 if(shell)shell.inert=!!dialog;
 if(dialog){if(!oldDialog||state.modal)(dialog.querySelector('button:not([disabled])')||dialog).focus({preventScroll:true})}
 else if(oldDialog&&modalReturnFocus){const target=modalReturnFocus.id?$(modalReturnFocus.id):frame.querySelector('[data-action="'+modalReturnFocus.dataset.action+'"]');target?.focus({preventScroll:true});modalReturnFocus=null}
 else if(active&&$(active))$(active).focus({preventScroll:true});

}
function updateProgress(){if($('progressPercent'))$('progressPercent').textContent=state.progress;if($('progressFill'))$('progressFill').style.width=state.progress+'%';if($('progressBar'))$('progressBar').setAttribute('aria-valuenow',state.progress)}
function startOperation(operation){stopTimer();state.modal=null;state.operation=operation;state.progress=0;state.step=operation==='copy'?'copying':operation==='repair'?'repairing':operation==='uninstall'?'uninstalling':'installing';render();operationTimer=setInterval(()=>{if(state.modal||state.closed||state.minimized)return;state.progress=Math.min(100,state.progress+5);if(state.scenario==='error'&&!state.failureConsumed&&state.progress>=45){state.failureConsumed=true;stopTimer();state.step='error';render();return}if(state.progress>=100){stopTimer();state.installed=operation!=='uninstall';state.step=operation==='uninstall'?'removed':'complete';render()}else updateProgress()},180)}
function requestInstall(operation='install'){if(busy()||state.modal)return;state.operation=operation;state.modal='auth';render()}
function action(name,target){if(state.closed)return;switch(name){
case 'window-minimize':state.minimized=!state.minimized;render();break;
case 'window-zoom':$('installerWindow').classList.toggle('zoomed');break;
case 'window-close':case 'cancel':case 'eject':if(busy()){state.modal='cancel';render()}else{state.closed=true;stopTimer();render()}break;
case 'finish':state.closed=true;stopTimer();render();break;
case 'modal-dismiss':state.modal=null;render();break;
case 'stop':stopTimer();state.modal=null;state.progress=0;state.step=state.installed?'maintenance':'welcome';render();break;
case 'linux-install':requestInstall();break;case 'linux-remove':requestInstall('uninstall');break;case 'authorize':startOperation(state.operation);break;
case 'open-app':state.launch=true;state.closed=true;render();break;
case 'retry':requestInstall(state.operation);break;
}}
document.addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(!target||target.disabled||target.closest('[inert]'))return;action(target.dataset.action,target)});
document.addEventListener('keydown',event=>{
 if(state.closed)return;
 const dialog=[...document.querySelectorAll('.dialog')].at(-1);
 if(event.key==='Escape'){if(state.modal){state.modal=null;render()}else if(busy()){state.modal='cancel';render()}else{state.closed=true;render()}event.preventDefault();return}
 if(event.key==='Tab'&&dialog){const controls=[...dialog.querySelectorAll('button:not([disabled]),input:not([readonly]),[tabindex="0"]')];if(controls.length){const first=controls[0],last=controls.at(-1);if(event.shiftKey&&document.activeElement===first){last.focus();event.preventDefault()}else if(!event.shiftKey&&document.activeElement===last){first.focus();event.preventDefault()}}}
 if(dialog||state.minimized)return;

});

matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(state.theme==='system')render()});

window.CodeWFInstallerPrototype={get state(){return {...state}},get config(){return {...prototypeConfig}},get products(){return products.map(item=>({...item}))},set(options={}){stopTimer();for(const key of ['language','theme','reduced'])if(options[key]!==undefined)state[key]=options[key];if(['new','installed','error'].includes(options.scenario)){state.scenario=options.scenario;state.installed=options.scenario==='installed'}resetFlow()},reset:resetFlow};
