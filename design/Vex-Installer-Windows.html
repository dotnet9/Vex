const params=new URLSearchParams(location.search);
const initialScenario=['new','installed','error'].includes(params.get('scenario'))?params.get('scenario'):'new';
const defaultPath='C:\\Users\\User\\AppData\\Local\\Programs\\Vex';
const state={language:params.get('lang')==='en'?'en':'zh',theme:['light','dark'].includes(params.get('theme'))?params.get('theme'):'system',platform:'windows',product:'vex',arch:'x64',scenario:initialScenario,scope:'user',path:defaultPath,step:initialScenario==='installed'?'maintenance':'welcome',desktop:false,association:true,launch:false,keepData:true,operation:'install',progress:0,modal:null,customOpen:false,closed:false,reduced:false,installed:initialScenario==='installed',failureConsumed:false};
const $=id=>document.getElementById(id);
const text=key=>words[state.language][key]||key;
const escape=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const busy=()=>['installing','repairing','uninstalling'].includes(state.step);
let operationTimer=null,returnFocus=null;
function button(label,action,{primary=false,quiet=false,id='',disabled=false}={}){
  return `<button type="button" class="btn${primary?' primary':''}${quiet?' quiet':''}" data-action="${action}"${id?` id="${id}"`:''}${disabled?' disabled':''}>${escape(text(label))}</button>`;
}
function pathError(){
  const path=state.path.trim();
  if(!/^[a-z]:\\[^<>:"|?*\x00-\x1f]+$/i.test(path)||path.split('\\').slice(1).some(part=>part==='..'||part==='.'||/[. ]$/.test(part)))return text('invalidPath');

  return '';
}
function hero(){return `<div class="product-mark" aria-hidden="true">V</div><h1>${text('name')}</h1><p class="slogan">${text('slogan')}</p>`;}
function welcome(){return hero()+`<div class="install-controls">${button('install','install',{primary:true,id:'primaryAction',disabled:!!pathError()})}<details class="custom" id="customSettings"${state.customOpen?' open':''}><summary>${text('custom')}</summary><div class="settings"><label for="installPath" class="path-label">${text('path')}</label><div class="field-row"><input type="text" id="installPath" value="${escape(state.path)}" aria-invalid="${!!pathError()}" aria-describedby="pathError" spellcheck="false" autocomplete="off">${button('browse','browse')}</div><p id="pathError" class="field-error" role="alert"${pathError()?'':' hidden'}>${escape(pathError())}</p><p class="scope-note">${text('scope')}</p><label class="check-row"><input type="checkbox" id="desktopShortcut"${state.desktop?' checked':''}><span>${text('desktop')}</span></label><label class="check-row"><input type="checkbox" id="fileAssociations"${state.association?' checked':''}><span>${text('associations')}<small>${text('associationHint')}</small></span></label></div></details></div>`;}
function progress(){return hero()+`<section class="status-area"><h2>${text(state.step)}</h2><div class="progress-meta"><span>${text('progress')}</span><span class="progress-percent"><span id="progressPercent">${state.progress}</span>%</span></div><div class="progress-track" role="progressbar" aria-label="${text('progress')}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${state.progress}" id="progressBar"><div class="progress-fill" id="progressFill" style="width:${state.progress}%"></div></div><div class="progress-cancel">${button('cancel','cancel',{quiet:true})}</div></section>`;}
function complete(){const removed=state.step==='removed';return hero()+`<section class="status-area"><h2>${text(removed?'removed':state.operation==='repair'?'repairComplete':'complete')}</h2>${removed?`<p class="status-description">${text(state.keepData?'dataKept':'dataRemoved')}</p>${button('finish','finish',{primary:true,id:'primaryAction'})}`:`${button('openApp','open-app',{primary:true,id:'primaryAction'})}<div class="secondary-actions">${button('finish','finish',{quiet:true})}</div>`}</section>`;}
function maintenance(){return hero()+`<section class="status-area"><h2>${text('maintenance')}</h2><p class="status-description">${text('maintenanceIntro')}</p>${button('repair','repair',{primary:true,id:'primaryAction'})}<div class="secondary-actions">${button('uninstall','remove',{quiet:true})}</div></section>`;}
function errorScreen(){return hero()+`<section class="status-area"><h2>${text('error')}</h2><p class="status-description error-message" role="alert">${text('errorBody')}</p>${button('retry','retry',{primary:true,id:'primaryAction'})}${state.operation==='install'?`<div class="secondary-actions">${button('changePath','change-path',{quiet:true})}</div>`:''}</section>`;}
function render(){
  document.documentElement.lang=state.language==='zh'?'zh-CN':'en';
  document.documentElement.dataset.theme=state.theme==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):state.theme;
  document.documentElement.dataset.reduced=String(state.reduced);
  document.title=text('title');$('windowTitle').textContent=text('title');
  const frame=$('installerWindow');frame.hidden=state.closed;frame.dataset.step=state.step;frame.setAttribute('aria-label',text('title'));
  frame.querySelector('.caption-close').setAttribute('aria-label',text('close'));$('licenseButton').textContent=text('license');
  $('screen').dataset.step=state.step;
  const views={welcome,installing:progress,repairing:progress,uninstalling:progress,complete,removed:complete,maintenance,error:errorScreen};
  $('screen').innerHTML=(views[state.step]||welcome)();
  $('customSettings')?.addEventListener('toggle',event=>{state.customOpen=event.target.open});
  renderModal();
}
function openModal(name){returnFocus=document.activeElement;state.modal=name;renderModal();}
function dismissModal(){state.modal=null;renderModal();const next=returnFocus?.isConnected?returnFocus:returnFocus?.id?$(returnFocus.id):null;next?.focus({preventScroll:true});returnFocus=null;}
function renderModal(){
  $('screen').inert=!!state.modal;document.querySelector('.window-footer').inert=!!state.modal;
  $('installerWindow').classList.toggle('license-open',state.modal==='license');
  let heading='',body='',actions='';
  if(state.modal==='browse'){
    heading=text('browseTitle');body=`<p>${text('browseIntro')}</p><div class="picker-options">${['C:\\Apps\\Vex','D:\\Apps\\Vex'].map(path=>`<button class="btn" type="button" data-action="pick-folder" data-path="${escape(path)}">${escape(path)}</button>`).join('')}</div>`;actions=button('back','modal-dismiss');
  }else if(state.modal==='license'){
    heading=text('licenseTitle');body=`<div class="license" tabindex="0" aria-label="MIT License">${escape(mit)}</div>`;actions=button('back','modal-dismiss');
  }else if(state.modal==='cancel'){
    heading=text('cancelTitle');body=`<p>${text('cancelBody')}</p>`;actions=button('continue','modal-dismiss')+button('stop','stop',{primary:true});
  }else if(state.modal==='remove'){
    heading=text('removeTitle');body=`<p>${text('removeBody')}</p><label class="check-row"><input type="checkbox" id="keepData"${state.keepData?' checked':''}><span>${text('keepData')}<small>${text('keepDataHint')}</small></span></label><p class="field-error" id="removeWarning"${state.keepData?' hidden':''}>${text('dataWarning')}</p>`;actions=button('cancel','modal-dismiss')+button('uninstall','uninstall',{primary:true});
  }

function stopTimer(){if(operationTimer){clearInterval(operationTimer);operationTimer=null;}}
function startOperation(operation='install'){
  if(busy()||state.closed)return;
  if(operation==='install'&&pathError()){state.customOpen=true;render();$('installPath')?.focus();return;}

  state.step=operation==='repair'?'repairing':operation==='uninstall'?'uninstalling':'installing';render();

    if(state.modal||state.closed)return;
    state.progress=Math.min(100,state.progress+5);
    if(state.scenario==='error'&&!state.failureConsumed&&state.progress>=45){state.failureConsumed=true;stopTimer();state.step='error';render();$('primaryAction')?.focus();return;}
    if(state.progress>=100){stopTimer();state.installed=operation!=='uninstall';state.step=operation==='uninstall'?'removed':'complete';render();$('primaryAction')?.focus();return;}

function resetFlow(){stopTimer();Object.assign(state,{step:state.installed?'maintenance':'welcome',progress:0,modal:null,closed:false,customOpen:false,launch:false,failureConsumed:false});render();}
function action(name,target){
  if(state.closed)return;
  switch(name){
    case 'install':startOperation();break;
    case 'repair':startOperation('repair');break;
    case 'remove':openModal('remove');break;
    case 'uninstall':startOperation('uninstall');break;
    case 'retry':startOperation(state.operation);break;
    case 'change-path':state.step='welcome';state.customOpen=true;render();$('installPath')?.focus();break;
    case 'browse':openModal('browse');break;
    case 'pick-folder':state.path=target.dataset.path;state.modal=null;state.customOpen=true;render();$('installPath')?.focus();break;
    case 'license':openModal('license');break;
    case 'modal-dismiss':dismissModal();break;
    case 'cancel':case 'window-close':if(state.modal){dismissModal()}else if(busy()){openModal('cancel')}else{state.closed=true;stopTimer();render()}break;
    case 'stop':stopTimer();state.modal=null;state.progress=0;state.step=state.installed?'maintenance':'welcome';render();$('primaryAction')?.focus();break;
    case 'open-app':state.launch=true;state.closed=true;render();break;
    case 'finish':state.launch=false;state.closed=true;render();break;
  }
}

document.addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(!target||target.disabled||target.closest('[inert]'))return;action(target.dataset.action,target)});
document.addEventListener('input',event=>{if(event.target.id==='installPath'){state.path=event.target.value;const error=pathError();$('pathError').textContent=error;$('pathError').hidden=!error;event.target.setAttribute('aria-invalid',String(!!error));$('primaryAction').disabled=!!error;}});
document.addEventListener('change',event=>{const input=event.target;if(input.id==='desktopShortcut')state.desktop=input.checked;else if(input.id==='fileAssociations')state.association=input.checked;else if(input.id==='keepData'){state.keepData=input.checked;$('removeWarning').hidden=state.keepData;}});
document.addEventListener('keydown',event=>{
  if(state.closed)return;
  if(event.key==='Escape'){event.preventDefault();if(state.modal)dismissModal();else if(busy())openModal('cancel');else{state.closed=true;render()}return;}
  const dialog=document.querySelector('.dialog');
  if(event.key==='Tab'&&dialog){const controls=[...dialog.querySelectorAll('button:not([disabled]),input,[tabindex="0"]')];const first=controls[0],last=controls.at(-1);if(event.shiftKey&&document.activeElement===first){last.focus();event.preventDefault()}else if(!event.shiftKey&&document.activeElement===last){first.focus();event.preventDefault()}}
  if(dialog)return;
