<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>删除确认 · Vex 界面原型</title>
<link rel="stylesheet" href="../assets/theme.css">
<script src="../assets/theme.js"></script>
<script src="../assets/interact.js"></script>
<style>
  .host {
    position: relative;
    height: 560px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-window);
    background: var(--bg);
  }
  .host .ghost {
    height: 100%;
    background: repeating-linear-gradient(45deg, var(--splitter) 0 12px, transparent 12px 24px);
    opacity: .5;
  }
</style>
</head>
<body data-page="dialog-delete">

<svg xmlns="http://www.w3.org/2000/svg" style="display:none"><defs>
  <symbol id="i-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></symbol>
</defs></svg>

<header class="proto-head">
  <div class="proto-crumb"><a href="../index.html">Vex 界面原型</a> / 删除确认</div>
  <h1>删除确认 <span class="proto-tag">独立窗口</span></h1>
  <p class="proto-desc">删除磁盘文件的最终确认（独立模态窗口）。<b>本稿升级点</b>：① 标题行前置红色删除图标，危险等级即时可感；② 删除目标完整路径以代码芯片回显；③ 「删除」按钮采用红色描边（悬停转实心），与普通操作明确区隔；④ 窗口不可调整大小、无最小化按钮，保持确认语境单一。</p>
</header>

<main class="stage">
  <div class="host">
    <div class="ghost"></div>
    <div class="mini-window" style="position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width: 480px;">
      <div class="mini-titlebar">
        删除确认
        <span class="caption-btns">
          <span class="caption-btn"><svg class="sym" style="width:11px;height:11px"><use href="#i-x"/></svg></span>
        </span>
      </div>
      <div style="padding: 22px;">
        <div class="dlg-title" style="font-size:15.5px;font-weight:600;display:flex;align-items:center;gap:10px;">
          <span class="dlg-ico warn"><svg style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><use href="#i-trash"/></svg></span>
          确定要删除「读书摘录.md」吗？
        </div>
        <p class="dlg-msg">此操作会从磁盘永久删除该文件，且无法从回收站恢复（仅 Windows 直接删除）。</p>
        <div class="dlg-path mono">D:\Notes\笔记\读书摘录.md</div>
        <div class="dlg-actions">
          <button class="btn" id="del-cancel">取消</button>
          <button class="btn danger" id="del-ok">删除</button>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
  // 删除窗口演示：取消 / 删除 / 标题栏 × 都会关闭窗口（App 中 = 取消删除）
  var host = document.querySelector('.host');
  var win = host.querySelector('.mini-window');
  var chip = document.createElement('span');
  chip.className = 'reopen-chip';
  chip.textContent = '窗口已关闭 · 点击重新打开';
  chip.style.display = 'none';
  host.appendChild(chip);
  function closeWin(msg) {
    win.style.display = 'none';
    chip.style.display = '';
    if (msg) VexProto.toast(msg);
  }
  chip.addEventListener('click', function () {
    win.style.display = '';
    chip.style.display = 'none';
  });
  document.getElementById('del-cancel').addEventListener('click', function () { closeWin('已取消，文件安全'); });
  document.getElementById('del-ok').addEventListener('click', function () { closeWin('已删除「读书摘录.md」（演示）'); });
  // 标题栏 × ：拦截全局「返回来源页」行为，改为窗口内取消
  host.querySelector('.mini-titlebar .caption-btn').addEventListener('click', function (e) {
    e.stopPropagation();
    closeWin('已取消，文件安全');
  });
</script>

</body>
</html>
