<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>未保存更改 · Vex 界面原型</title>
<link rel="stylesheet" href="../assets/theme.css">
<script src="../assets/theme.js"></script>
<script src="../assets/interact.js"></script>
<style>
  .host {
    position: relative;
    height: 560px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-window);
    background: var(--bg);
  }
  .host .ghost {
    height: 100%;
    background: repeating-linear-gradient(45deg, var(--splitter) 0 12px, transparent 12px 24px);
    opacity: .5;
  }
</style>
</head>
<body data-page="dialog-unsaved">

<svg xmlns="http://www.w3.org/2000/svg" style="display:none"><defs>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></symbol>
</defs></svg>

<header class="proto-head">
  <div class="proto-crumb"><a href="../index.html">Vex 界面原型</a> / 未保存更改</div>
  <h1>未保存更改确认 <span class="proto-tag">覆盖层</span></h1>
  <p class="proto-desc">关闭文档、打开其他文件或 AI 改写前的保存确认。<b>本稿升级点</b>：① 顶部增加语义图标（琥珀警示），标题与图标对齐，情绪传达更快；② 三个操作按风险分级：<b>保存</b>（主题色实心，推荐）、<b>不保存</b>（描边）、<b>取消</b>（描边）；③ 文件路径以代码芯片回显；④ 遮罩加轻微模糊，聚焦弹窗。按 Esc / 点击遮罩默认等于「取消」，避免误丢稿。</p>
</header>

<main class="stage">
  <div class="host">
    <div class="ghost"></div>
    <div class="overlay">
      <div class="dialog">
        <div class="dlg-title">
          <span class="dlg-ico warn"><svg><use href="#i-warn"/></svg></span>
          未保存的更改
        </div>
        <p class="dlg-msg">「主题设计笔记.md」有尚未保存的修改。关闭前要保存这些更改吗？</p>
        <div class="dlg-path mono">D:\Notes\笔记\主题设计笔记.md</div>
        <div class="dlg-actions">
          <button class="btn">取消</button>
          <button class="btn">不保存</button>
          <button class="btn primary">保存</button>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
  VexProto.dialogDemo({
    host: '.host',
    chipText: '演示结束 · 点击重新打开确认弹窗',
    scrimCancel: true,
    scrimMsg: '已取消（点击遮罩 = 取消）',
    bind: function (overlay, close) {
      var btns = overlay.querySelectorAll('.dlg-actions .btn');
      btns[0].addEventListener('click', function () { close('已取消，继续编辑'); });
      btns[1].addEventListener('click', function () { close('已放弃修改并关闭文档'); });
      btns[2].addEventListener('click', function () { close('已保存并关闭文档'); });
    }
  });
</script>

</body>
</html>
