<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="'Segoe UI','Microsoft YaHei UI',sans-serif">
  <rect width="900" height="340" fill="#FDFDFD"/>
  <g stroke="#E8EAEE" stroke-width="1">
    <path d="M60 40 V290 M60 290 H840"/>
    <path d="M60 90 H840 M60 140 H840 M60 190 H840 M60 240 H840"/>
    <path d="M180 40 V290 M300 40 V290 M420 40 V290 M540 40 V290 M660 40 V290 M780 40 V290"/>
  </g>
  <path d="M60 240 C240 40 480 290 840 90" fill="none" stroke="#4338CA" stroke-width="3"/>
  <g stroke="#B45309" stroke-width="1.2" stroke-dasharray="5 4">
    <path d="M60 240 L240 40"/>
    <path d="M240 40 L480 290"/>
    <path d="M480 290 L840 90"/>
  </g>
  <g>
    <circle cx="60" cy="240" r="7" fill="#0F7670"/>
    <circle cx="240" cy="40" r="7" fill="#B45309"/>
