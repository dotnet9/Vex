  <g font-size="12" fill="#6B7280">
    <text x="46" y="264">P0 (60,240)</text>
    <text x="212" y="30">P1 (240,40) 控制点</text>
    <text x="452" y="314">P2 (480,290) 控制点</text>
    <text x="790" y="80">P3 (840,90)</text>
  </g>
  <text x="450" y="326" text-anchor="middle" font-size="12" fill="#9CA3AF">三次贝塞尔：B(t) = (1−t)³P0 + 3(1−t)²t·P1 + 3(1−t)t²·P2 + t³P3，t ∈ [0,1]</text>
  <text x="105" y="230" font-size="12" fill="#0F7670" font-weight="600">曲线从 P0 出发</text>
